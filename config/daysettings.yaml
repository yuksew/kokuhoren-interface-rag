# 設定方法の表（src/transcribe_examples.py --kind daysettings）を、どう採用するか（src/build_daysettings.py が読む）。
# - 表は「サービス種類（名前・コード）｜事務処理要領｜データ設定例」。事務処理要領のセルを共有するサービスのまとまりを1件にする。
# - base: 基本に採るモデル。use: 頁ごとに別のモデルを採る（"頁": モデル）
# - 採った理由は原本の画像と照らして確かめたもの（2026-11-02）。サービスの行・コード・カレンダーの表は両モデルで一致
# - 「（N）と同様」は、同じ part の中で（N）から始まるデータ設定例を引いて、事例の本文に付ける
# - 注記（※N）は頁ごとに番号が振り直されている。頁に注記が無いときは、次の頁が注記だけの頁ならそれを、無ければ前の頁のものを使う
docs:
  - doc: shogai_jigyosho_r0710
    parts:
      - {pages: 23-30, label: 介護給付費等 明細書}       # 1.2.3.2 (4) 日数情報レコードの設定方法（障害者）。p28 は p27 の表の注記だけ
      - {pages: 237-241, label: 障害児給付費等 明細書}   # 2.1.3.2 (4) 日数情報レコードの設定方法（障害児）
    base: sonnet
    # 違い（原本で確かめた。どれも Sonnet が正しい）
    #   p23 一連の利用契約の「日付を記載する」（Haiku は「記載」）／p27 短期入所「当該月に実際に」（Haiku は「に」が抜け）
    #   p30 (10)①「入所中」（Haiku は「入院中」）／p237 表の下の注記 ※1〜※3（Haiku は落とした）
    #   p240・p241 は全角・半角と空行の違いだけ
    use: {}
    notes:
      # "頁#まとまりの番号（その頁の上から 0 から）": 書き起こしの注記
      "241#0": 原本のまま。外泊日数の設定例だが、データ設定例の文は「期間入院した場合」「明細書の入院日数」となっている（障害者の p30 の同じ例は「外泊した場合」「明細書の外泊日数」）。
