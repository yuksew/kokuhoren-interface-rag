# 設定例の書き起こし（src/transcribe_examples.py）を、どう採用するか（src/build_examples.py が読む）。
# - base: 基本に採るモデル。use: 事例ごとに別のモデルを採る（"頁#その頁の何件目（0 から）": モデル）
# - 採った理由は原本の画像と照らして確かめたもの（2026-11-02）。
docs:
  - doc: shogai_jigyosho_r0710
    # parts: 頁の範囲ごとに、事例の見出しの前に付ける言葉（label）。同じ編の中で「②通所系」などの番号が重なるので
    parts:
      - {pages: 161-210}                 # 障害者（2.1.2.x サービス提供実績記録票設定例）
      - {pages: 300-305, label: 障害児}   # 障害児（2.1.3.6 (9) 実績記録票インタフェース設定例）
    base: sonnet
    use:
      "201#0": haiku   # 紙様式の「合計」行。Sonnet は 6 を曜日の列にずらした（原本は算定日数の列）
      "202#0": haiku   # 紙様式の「合計」行。Sonnet は「合計」を日の列に置いた（原本は提供時間の列）
      "195#0": haiku   # 事例名（【サービス提供年月:平成30年3月以前】）を Haiku だけが拾った。表のセルは同じ
      "206#0": haiku   # 紙様式の上の受給者証番号・障害者名・事業所番号・事業所名を Haiku だけが拾った
      "207#0": haiku   # 表の下の「退居日 R6年4月5日」「退所日」の欄を Haiku だけが拾った
      "168#0": haiku   # Sonnet は「算定の考え方」の表の下の「※0 時をまたがった場合、0 時で分けて算定する」を落とした
      "209#0": haiku   # 「合計」行の位置（原本は提供時間の列）
      "209#1": haiku   # 同上
      "303#0": haiku   # 表の下の「移行日 R6年5月28日」の欄を Haiku だけが拾った
      "305#0": haiku   # 紙様式の上の受給者証番号などの欄を Haiku だけが拾った
      # 302#0 は Sonnet（1回目は設定側を落としたので書き直した。Haiku は事業所番号を 9950000000001 と誤読）
    # 195・206・207・302・303・305 は、【】の無い事例名（左の欄の説明文）を落としていたので、指示を直して書き起こし直した
    # 両モデルで表の分け方だけが違い、中身は同じだったもの: 204#0・205#0（Sonnet の分け方のまま）
    # 書き起こしの表だけでは誤読しやすいところの注記（事例の本文に「書き起こしの注記」として付ける）。原本の画像で確かめたもの
    notes:
      "201#0": 合計行の送迎加算の「2」は、原本では「往」「復」の2列にまたがる1つのセルで、往と復を合わせた回数（往1＋復1）。表では「往」の列に入れてある（紙様式記載・インタフェース設定とも）。
      "202#0": インタフェース設定の合計行の送迎の「4」は、原本では「往」「復」の2列にまたがる1つのセルで、往と復を合わせた回数（往2＋復2）。表では「往」の列に入れてある。
    # 横に複数の列にまたがるセル（書き起こしでは最初の列に入れてある）。example_cells.csv の span_to 列に、またがる最後の列を書く
    spans:
      "201#0": [{row: 合計, from: "送迎加算 > 往", to: "送迎加算 > 復"}]
      "202#0": [{row: 合計, from: "送迎 > 往", to: "送迎 > 復", role: interface}]
