# 検索の評価用の質問（正解は DB の行を条件で指定する。item_id は DB を作り直すと変わるので使わない）
# gold: どれか1つの行が上位に入れば正解。doc は doc_id の前方一致、name は項目名（階層つき）に含まれる文字列（空白を無視）
# table_kind: 指定すると、その種類の表の行だけを正解にする（必須対応表の同名の行を除く など）
# domain: 画面で介護・障害を選んだ想定の絞り込み
# expect: 回答に含まれるべき語（NFKC・空白無視で照合。「A|B」はどちらかでよい）
# kind: exact = 項目名をそのまま含む質問 / paraphrase = 言い換え / code = 番号で聞く / table = 表単位の質問
- q: 受給者証番号の桁数と属性を教えて
  domain: shogai
  kind: exact
  gold: [{doc: shogai_jigyosho, name: 受給者証番号}]
  expect: ["英数", "10"]
