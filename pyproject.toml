[project]
name = "kokuhoren-interface-rag"
version = "0.1.0"
description = "介護・障害福祉 国保連インタフェース仕様書 RAG（フェーズ0〜1: 仕様書の特定・取得と表の書き起こし検証）"
readme = "README.md"
authors = [
    { name = "yuk", email = "yuksew@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.10",
    "pymupdf>=2.0",
    "pypdf>=6.21.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[tool.uv]
package = false

# フェーズ2（埋め込み検索）用。torch が大きいので通常の依存とは分ける: uv run --group rag ...
[dependency-groups]
rag = [
    "numpy>=2.0",
    "sentence-transformers>=4.0",
    "transformers>=4.48",
    "sentencepiece>=0.2",
    "torch>=2.7",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
