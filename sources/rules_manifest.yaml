# 算定ルール資料 ソース一覧（告示・留意事項・記載要領・Q&A・サービスコード表）
# - 調査の根拠と判断は sources/rules_survey.md。取得は:
#     uv run python src/fetch.py --manifest sources/rules_manifest.yaml
#   → sources/raw/rules/{domain}/{id}.{pdf,html,xlsx,xls,zip}、sha256 はこのファイルに書き戻す（ログは fetch_log.rules.json）
# - 方針（2026-11-01 に利用者と決定）:
#   1. 全文があるものは全文を使う（介護の告示 = 法令等データベースの溶け込み版、障害の留意事項 = 新旧2段の「改正後」欄）。
#      全文が無いものは新旧対照表を日付つきで積み重ね、新しい方を優先して答えさせる。自前で溶け込み版は作らない。
#   2. 介護の記載要領は WAM 確定版（R8.5.25、インタフェース仕様書と同じ確定版に同梱）を正本とする。
#   3. Q&A は現行の系統だけ（介護 R6 Vol.1〜18 と R8 系、障害 R6・R8 系）。令和3年度以前は後回し。
#   4. 次の改定（R9）は status: future で登録だけ。取り込まない。
# - フィールド:
#   category: kokuji（告示）| kokuji_kaisei（改正告示）| ryui（留意事項）| kisai（記載要領・記載例）| qa | errata（正誤）
#             | servicecode（サービスコード表）| kozo（算定構造・対応表）| sogo（総合事業）
#   format:   pdf | html_pages（法令等DB、複数ページを1ファイルに）| xlsx | xls | zip
#   effective: 施行・適用日（分かる範囲）。答えるときの「新しい方を優先」に使う
#   ingest:   prose（本文として取り込む）| table（Excel を表として取り込む）| none（保存だけ）

# =====================================================================
# 介護保険（kaigo）
# =====================================================================

